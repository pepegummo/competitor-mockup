# ทุก container บนเครื่องเดียว · ฐานข้อมูลเลือกได้ 3 แบบด้วย DATABASE_URL ใน .env:
#   RDS (Huawei):     DATABASE_URL=postgresql://app:<รหัส>@<IP ภายในของ RDS>:5432/competitor  แล้ว docker compose up -d --build
#   container db:     ใส่ POSTGRES_PASSWORD และ DATABASE_URL=postgresql://app:<รหัสเดียวกัน>@db:5432/competitor
#                     แล้ว docker compose --profile localdb up -d --build
#   SQLite (เดิม):    เว้น DATABASE_URL ว่าง ข้อมูลอยู่ในไฟล์ใน volume app_data
#   เปิด OCR:         เพิ่ม --profile ocr และใส่ OCR_URL=http://ocr:8000 ใน .env
#   บน ECS ที่ pull image จาก SWR: ตั้ง APP_IMAGE / OCR_IMAGE ใน .env แล้ว docker compose pull && docker compose up -d
# config ทั้งหมดอยู่ใน .env (ดู .env.example) · volume app_data ยังใช้เก็บข้อมูลดิบ PDF ที่อัปโหลด และ log แม้ใช้ PostgreSQL
x-logging: &logging  # log ของ docker ไม่เกิน 30 MB ต่อ container ไม่ให้ดิสก์ ECS เต็ม
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app: &app
  image: ${APP_IMAGE:-competitor-app:latest}
  build: .
  env_file: .env
  volumes: ["app_data:/app/data"]
  depends_on:
    db: { condition: service_healthy, required: false }  # ใช้ RDS หรือ SQLite (ไม่เปิด profile localdb) ก็ขึ้นได้
  logging: *logging
  restart: unless-stopped

services:
  proxy:
    image: caddy:2
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]  # บนเครื่องที่พอร์ต 80 ไม่ว่าง: HTTP_PORT=8080
    # BASIC_AUTH_HASH ใน .env ว่าง = Caddyfile (ไม่มีรหัส ทุกคนเข้าได้) · มีค่า = Caddyfile.auth (ต้องใส่รหัส)
    volumes: ["./deploy/Caddyfile${BASIC_AUTH_HASH:+.auth}:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    env_file: .env
    environment:  # ค่าว่างใน .env = ใช้ค่าเริ่ม (Caddy ใช้ค่าเริ่มเฉพาะตอนไม่มีตัวแปร ไม่ใช่ตอนค่าว่าง)
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
    depends_on: [web]
    logging: *logging
    restart: unless-stopped

  web:
    <<: *app

  worker:
    <<: *app
    command: ["python", "worker.py"]
    healthcheck:
      disable: true  # HEALTHCHECK ใน image เช็คหน้าเว็บ ไม่เกี่ยวกับ worker

  db:  # PostgreSQL + pgvector ในเครื่องนี้ (ทดสอบ หรือใช้แทนตอนยังไม่มี RDS) สำรองด้วย pg_dump ดู DEPLOY.md
    image: pgvector/pgvector:pg16
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: competitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}  # ใช้ตอนสร้างฐานข้อมูลครั้งแรกเท่านั้น เปลี่ยนทีหลังต้อง ALTER USER
      TZ: Asia/Bangkok
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d competitor"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
    restart: unless-stopped

  ocr:
    image: ${OCR_IMAGE:-competitor-ocr:latest}
    build: ./ocr
    profiles: ["ocr"]
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1.5g }  # OCR ใช้ CPU เต็มตอนมีไฟล์ จำกัดไว้ไม่ให้หน้าเว็บช้า
    logging: *logging
    restart: unless-stopped

volumes:
  app_data:
  pg_data:
  caddy_data:
  caddy_config:
